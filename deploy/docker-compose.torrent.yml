services:
  gluetun:
    image: qmcgaw/gluetun:v3.39.1
    container_name: mytube-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9091:9091"   # Transmission Web UI & RPC forwarded securely through VPN
      - "51413:51413" # Transmission torrent peer listening port
      - "51413:51413/udp"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-custom}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - WIREGUARD_ADDRESSES=${VPN_WIREGUARD_ADDRESSES:-10.2.0.2/32}
      - FIREWALL_VPN_INPUT_PORTS=9091,51413
      - DOT=off
      - BLOCK_MALICIOUS=off
    secrets:
      - wireguard_private_key
    networks:
      - mytube-network

  transmission:
    image: lscr.io/linuxserver/transmission:4.0.5
    container_name: mytube-transmission
    restart: unless-stopped
    network_mode: "service:gluetun" # Complete network encapsulation with fail-closed killswitch
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME=/flood-for-transmission/
      - USER=${TRANSMISSION_USER:-admin}
      - PASS=${TRANSMISSION_PASS:-admin}
    volumes:
      - ${DATA_DIR:-../data}/transmission-config:/config
      - ${DOWNLOADS_DIR:-../media/downloads}:/downloads
      - ${DOWNLOADS_DIR:-../media/downloads}/watch:/watch

secrets:
  wireguard_private_key:
    file: ./secrets/wireguard_private_key.txt

networks:
  mytube-network:
    name: mytube-network
    driver: bridge

